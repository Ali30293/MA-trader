<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA TRADER | ADVANCED BOT</title>
    <style>
        :root { --gold: #ff9900; --bg: #1a1005; --card: #2a1b0a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; text-align: center; }
        .header { font-size: 28px; font-weight: 900; color: var(--gold); text-transform: uppercase; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,153,0,0.5); }
        .section-title { font-size: 14px; color: var(--gold); font-weight: bold; margin: 15px 0 10px; text-transform: uppercase; letter-spacing: 1px; }
        .grid-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .time-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .pair-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; border: 1px solid #443322; }
        button { background: transparent; border: 1px solid var(--gold); color: white; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.3s; }
        button:hover, button.active { background: var(--gold); color: black; font-weight: bold; }
        .generate-btn { width: 100%; background: #3d2b16; border: 2px solid var(--gold); color: var(--gold); padding: 15px; font-size: 18px; font-weight: 900; border-radius: 12px; margin-top: 20px; text-transform: uppercase; }
        #signal-output { margin-top: 20px; font-size: 35px; font-weight: 900; min-height: 50px; }
        #login-screen { background: var(--card); padding: 30px; border-radius: 20px; border: 2px solid var(--gold); margin-top: 50px; }
        input { width: 80%; padding: 12px; border-radius: 10px; border: 1px solid #555; background: #000; color: var(--gold); text-align: center; font-size: 18px; margin-bottom: 15px; outline: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <h1 style="color:var(--gold);">MA TRADER</h1>
        <p style="font-size: 12px; color: #aaa;">ENTER SECURITY CODE</p>
        <input type="password" id="pass" placeholder="****">
        <button class="generate-btn" style="padding:10px;" onclick="login()">UNLOCK ACCESS</button>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="header">🇵🇰 MA TRADER</div>
        
        <button class="generate-btn" style="background:#006400; border-color:#00ff00; color:white; margin-bottom:20px; font-size:14px;">🚀 JOIN FOR FREE BOTS</button>

        <div class="section-title">Broker Selection</div>
        <div class="grid-buttons">
            <button onclick="sel(this)">QUOTEX</button>
            <button onclick="sel(this)">POCKET OPTION</button>
        </div>

        <div class="section-title">Time Frame Selection</div>
        <div class="time-grid">
            <button onclick="sel(this)">1 MIN</button>
            <button onclick="sel(this)">2 MIN</button>
            <button onclick="sel(this)">3 MIN</button>
            <button onclick="sel(this)">4 MIN</button>
            <button onclick="sel(this)">5 MIN</button>
        </div>

        <div class="section-title">Pair Selection</div>
        <div class="pair-grid">
            <button onclick="sel(this)">EUR/USD</button>
            <button onclick="sel(this)">GBP/USD</button>
            <button onclick="sel(this)">USD/JPY</button>
            <button onclick="sel(this)">AUD/USD</button>
            <button onclick="sel(this)">USD/CAD</button>
            <button onclick="sel(this)">EUR/GBP</button>
        </div>

        <button class="generate-btn" onclick="getSignal()">📊 GENERATE SIGNAL</button>
        <div id="signal-output">READY</div>
        <p style="font-size:10px; color:#666;">AUTHORIZED: ALI | V2.0</p>
    </div>
</div>

<script>
    function login() {
        if(document.getElementById('pass').value === "MA-786") {
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('dashboard').style.display = "block";
        } else { alert("WRONG CODE!"); }
    }

    function sel(btn) {
        let parent = btn.parentElement;
        parent.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function getSignal() {
        const out = document.getElementById('signal-output');
        out.innerText = "ANALYZING...";
        out.style.color = "white";
        setTimeout(() => {
            const up = Math.random() > 0.5;
            out.style.color = up ? "#00ff88" : "#ff3366";
            out.innerText = up ? "CALL ↑" : "PUT ↓";
        }, 1500);
    }
</script>

</body>
</html>
