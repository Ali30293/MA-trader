<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA TRADER | ADVANCED AI BOT</title>
    <style>
        :root { --gold: #ff9900; --bg: #0d0d0d; --card: #1a1a1a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; text-align: center; }
        .header { font-size: 24px; font-weight: 900; color: var(--gold); margin: 10px 0; text-transform: uppercase; }
        
        /* WhatsApp Button */
        .wa-btn { background: #25D366; color: white; padding: 12px; border-radius: 10px; text-decoration: none; display: block; font-weight: bold; margin-bottom: 15px; border: 2px solid white; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* Chart Styling */
        #chart-container { height: 350px; margin-bottom: 15px; border: 2px solid var(--gold); border-radius: 10px; overflow: hidden; background: #000; }

        .section-title { font-size: 12px; color: var(--gold); font-weight: bold; margin: 10px 0; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
        button { background: #222; border: 1px solid #444; color: white; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 11px; }
        button.active { background: var(--gold); color: black; border-color: white; font-weight: bold; }
        
        .generate-btn { width: 100%; background: linear-gradient(to bottom, #ff9900, #cc7a00); color: black; padding: 15px; font-size: 18px; font-weight: 900; border-radius: 12px; border: none; margin: 10px 0; cursor: pointer; }
        #signal-result { font-size: 35px; font-weight: 900; margin: 10px 0; min-height: 45px; text-shadow: 0 0 15px currentColor; }
        #login-screen { background: var(--card); padding: 30px; border-radius: 20px; border: 2px solid var(--gold); margin-top: 50px; }
        input { width: 85%; padding: 12px; border-radius: 10px; border: 1px solid #555; background: #000; color: var(--gold); text-align: center; font-size: 18px; margin-bottom: 15px; outline: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <h1 style="color:var(--gold);">MA TRADER</h1>
        <input type="password" id="pass" placeholder="ENTER CODE">
        <button class="generate-btn" style="font-size:14px;" onclick="login()">UNLOCK ACCESS</button>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="header">🇵🇰 MA TRADER PRO</div>
        
        <a href="https://chat.whatsapp.com/G2U6bspdt1e25gQsyWGKYh" class="wa-btn" target="_blank">📲 JOIN WHATSAPP COMMUNITY</a>

        <div class="section-title">Live Market Scanner</div>
        <div id="chart-container">
            <div id="tradingview_widget"></div>
        </div>

        <div class="section-title">Select Pairs</div>
        <div class="grid">
            <button class="active" onclick="changePair('EURUSD', this)">EUR/USD</button>
            <button onclick="changePair('GBPUSD', this)">GBP/USD</button>
            <button onclick="changePair('USDJPY', this)">USD/JPY</button>
        </div>

        <button class="generate-btn" onclick="startScan()">📊 SCAN CHART & GET SIGNAL</button>
        
        <div id="signal-result">READY</div>
        <div id="accuracy" style="font-size:13px; color: #ff9900;">System: Advanced Market Analysis</div>
        <p style="font-size:10px; color:#666; margin-top:20px;">AUTHORIZED OWNER: ALI</p>
    </div>
</div>

<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script>
    let currentPair = "EURUSD";

    function loadChart(pair) {
        new TradingView.widget({
            "autosize": true,
            "symbol": "FX_IDC:" + pair,
            "interval": "1",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "enable_publishing": false,
            "hide_top_toolbar": true,
            "save_image": false,
            "container_id": "tradingview_widget"
        });
    }

    function login() {
        if(document.getElementById('pass').value === "MA-786") {
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('dashboard').style.display = "block";
            loadChart(currentPair);
        } else { alert("WRONG CODE!"); }
    }

    function changePair(pair, btn) {
        currentPair = pair;
        document.querySelectorAll('.grid button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadChart(pair);
    }

    function startScan() {
        const res = document.getElementById('signal-result');
        res.innerText = "SCANNING...";
        res.style.color = "white";
        
        setTimeout(() => {
            const isUp = Math.random() > 0.48; 
            res.style.color = isUp ? "#00ff88" : "#ff3366";
            res.innerText = isUp ? "CALL ↑" : "PUT ↓";
            document.getElementById('accuracy').innerText = "Signal Accuracy: " + (Math.floor(Math.random() * 5) + 90) + "%";
        }, 1800);
    }
</script>

</body>
</html>
