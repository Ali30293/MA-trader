<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Location Tracker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 430px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      color: #111827;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    .location-box {
      margin-top: 20px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 12px;
      text-align: left;
      line-height: 1.8;
    }

    #mapLink {
      display: none;
      margin-top: 20px;
      text-decoration: none;
      font-weight: bold;
      color: #2563eb;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>📍 Location Tracker</h1>

    <p class="subtitle">
      Share your location with your permission.
    </p>

    <input
      type="tel"
      id="phone"
      placeholder="Enter phone number"
    >

    <button onclick="getLocation()">
      Share My Location
    </button>

    <div id="status"></div>

    <div class="location-box">
      <p>
        <strong>Latitude:</strong>
        <span id="latitude">---</span>
      </p>

      <p>
        <strong>Longitude:</strong>
        <span id="longitude">---</span>
      </p>

      <p>
        <strong>Accuracy:</strong>
        <span id="accuracy">---</span>
      </p>
    </div>

    <a
      id="mapLink"
      href="#"
      target="_blank"
    >
      🌍 Open Location in Google Maps
    </a>

  </div>


  <script>

    function getLocation() {

      const phone =
        document.getElementById("phone").value.trim();

      const status =
        document.getElementById("status");

      if (!phone) {
        status.textContent =
          "Please enter your phone number.";
        return;
      }

      if (!navigator.geolocation) {
        status.textContent =
          "Location is not supported by this browser.";
        return;
      }

      status.textContent =
        "Requesting location permission...";


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;


          document.getElementById("latitude")
            .textContent =
            latitude.toFixed(6);


          document.getElementById("longitude")
            .textContent =
            longitude.toFixed(6);


          document.getElementById("accuracy")
            .textContent =
            Math.round(accuracy) + " meters";


          const mapUrl =
            "https://www.google.com/maps?q="
            + latitude
            + ","
            + longitude;


          const mapLink =
            document.getElementById("mapLink");


          mapLink.href = mapUrl;

          mapLink.style.display = "block";


          status.textContent =
            "✅ Location received successfully.";


          console.log("Phone:", phone);
          console.log("Latitude:", latitude);
          console.log("Longitude:", longitude);

        },


        function(error) {

          if (error.code === 1) {

            status.textContent =
              "❌ Location permission was denied.";

          }

          else if (error.code === 2) {

            status.textContent =
              "❌ Location information unavailable.";

          }

          else if (error.code === 3) {

            status.textContent =
              "❌ Location request timed out.";

          }

          else {

            status.textContent =
              "❌ Unable to get location.";

          }

        },


        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }

      );

    }

  </script>

</body>
</html>
